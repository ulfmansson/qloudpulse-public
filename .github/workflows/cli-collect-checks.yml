# qloudpulse-collect's checks, on every pull request and on main: its tests, clippy, its changelog, and its dependencies
# against RustSec's advisories, the licences cli/collect/deny.toml allows, and crates.io as the only source. Weekly too, since an advisory can be
# published for a crate after it was merged. Every action is pinned by commit; the tools are pinned by version and
# built from crates.io with their own Cargo.lock.
name: Collect client checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: "1.88.0" # the client's rust-version, which the release builds use
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash
    working-directory: cli/collect

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - run: cargo test --locked

  # The browser code that reads encrypted values, against the vectors `cargo test` keeps current. The runner image's
  # own Node (20 or later has WebCrypto as a global); nothing is installed.
  browser:
    name: view token browser code
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --version && node --test web/qloudpulse-values.test.mjs

  clippy:
    name: cargo clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --no-self-update
      - run: cargo clippy --locked --all-targets -- -D warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - run: cargo install --locked cargo-deny@0.20.2
      - run: cargo deny --locked check advisories licenses sources

  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - run: cargo install --locked cargo-audit@0.22.2
      # Every crate of Cargo.lock, optional ones too: cargo deny above looks only at what the release targets build.
      - run: cargo audit

  offline:
    name: offline build has no qloudpulse host
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --no-self-update
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo build --locked --no-default-features
      # The promise in docs/offline-collection.md: a build without `upload` cannot contact qloudpulse.
      - run: |
          if strings target/debug/qloudpulse-collect | grep -i 'qloudpulse\.com'; then
            echo "::error::the offline build holds a qloudpulse host"; exit 1
          fi

  changelog:
    name: CHANGELOG.md
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # a pull request's merge commit and the base it merges into
      # The crate's version has a section, dated once released or "Unreleased" until then: the release notes come
      # from it, and cli/collect/release.sh refuses to release without its date.
      - name: The version has a section
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          grep -Fq "## [$version] - " CHANGELOG.md \
            || { echo "::error file=cli/collect/CHANGELOG.md::no section for $version, the version in cli/collect/Cargo.toml; add '## [$version] - Unreleased'"; exit 1; }
      # A warning, not a failure: not every change to the source is one a user would read about.
      - name: A change to the client says so under Unreleased
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD -- .)
          if grep -q '^cli/collect/src/' <<<"$changed" && ! grep -qx 'cli/collect/CHANGELOG.md' <<<"$changed"; then
            echo "::warning file=cli/collect/CHANGELOG.md::this pull request changes cli/collect/src; add a line under Unreleased in cli/collect/CHANGELOG.md if users would notice"
          fi
